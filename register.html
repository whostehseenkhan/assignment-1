<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width", initial-scale="1.0">

        <title>Register</title>
        <link rel="stylesheet" href="style.css">
        
    </head>


    <body>

        <header>
            <h1> AI Society</h1>
            <p>Join our University Club</p>
        </header>


        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html" class="active">Register</a>
        </nav>


        <main>
            <section>
                <h2>Event Registeration Form</h2>
                <p>Fill in your deatails to register for an event.</p>


                <form id="registration-form">

                    <label for="fullname">Full Name :</label>
                    <input type="text" id="fullname" name="fullname"
                     placeholder="Enter your full name" required>

                    <label for="email">University Email:</label>
                    <input type="email" id="email" name="email"
                     placeholder="Enter your university Email" required>

                    <label>Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your Phone number" required>

                    <label for="event">Choose an Event:</label>

                    <select id="event" name="event" required>

                        <option value="">-- Select an Event --</option>


                    <option value="Introduction to Artificial Intoelligence">
                        Introduction to Artificial Intoelligence
                    </option>


                    <option value="Web Development Workshop">
                        Web Development Workshop
                    </option>


                    <option value="Python Programming Session">
                        Python Programming Session
                    </option>


                    <option value="AI Project Competition">
                        AI Project Competition
                    </option>
                
                    </select>


                    <fieldset>

                        <legend>How did you hear about us?</legend>

                        <input type="radio" id="Social" name="source" value="Social Media" required>
                        <label for="Social">Social Media</label>

                        <input type="radio" id="friend" name="source" value="Friend">
                        <label for="friend">Friend</label>

                        <input type="radio" id="university" name="source" value="University">
                        <label for="university">University</label>

                    </fieldset>


                    <button type="submit">Register Now</button>
                </form>

                <p id="message"></p>

            </section>


            <section>
                <h2>Saved Registeration</h2>
                <ul id="registration-list"></ul>
                <button type="button" id="clear-btn">Clear All</button>
            </section>
        </main>

        <footer>
            <p>AI Society Club</p>
        </footer>

        <script src="script.js"></script>

    </body>
</html>
